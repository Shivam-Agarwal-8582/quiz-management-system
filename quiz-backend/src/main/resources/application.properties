# ---- MySQL datasource ----
spring.datasource.url=jdbc:mysql://localhost:3306/quizdb?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Shivam@2003}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# "update" keeps admin-created questions across restarts.
# If you change the schema drastically, drop the quizdb database once.
spring.jpa.hibernate.ddl-auto=update

# ---- Data seeding (idempotent thanks to INSERT IGNORE + unique text column) ----
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true

spring.jpa.show-sql=true
